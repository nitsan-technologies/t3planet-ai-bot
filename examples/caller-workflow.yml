name: T3Planet AI Bot

on:
  issues:
    types: [opened, labeled]
    # ClickUp only: use this list so closing an issue marks its task Done.
    # types: [opened, labeled, closed]
  issue_comment:
    types: [created]
  # ClickUp only: uncomment to mirror pull request activity into ClickUp.
  # Without ClickUp these events would only start runs that skip every job.
  # pull_request:
  #   types: [opened, edited, synchronize, reopened, closed, ready_for_review, converted_to_draft]
  # pull_request_review:
  #   types: [submitted, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  bot:
    # Prefer a release tag over @main in production. Keep bot_ref equal to it.
    uses: nitsan-technologies/t3planet-ai-bot/.github/workflows/bot.yml@main
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      # CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
    with:
      bot_ref: main
      base_branch: main
      # ClickUp is off unless this is true. `secrets` cannot be used inside
      # `with:`, so the ids and assignees are repository variables.
      clickup_enabled: false
      # clickup_team_id: ${{ vars.CLICKUP_TEAM_ID }}
      # clickup_list_id: ${{ vars.CLICKUP_LIST_ID }}
      # clickup_assignees: ${{ vars.CLICKUP_ASSIGNEES }}

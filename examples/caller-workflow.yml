name: T3Planet AI Bot

on:
  issues:
    types: [opened, labeled]
    # Opt-in ClickUp issue-close sync: use this list instead, then uncomment
    # the clickup job below and set clickup_enabled to "true".
    # types: [opened, labeled, closed]
  issue_comment:
    types: [created]
  # Optional ClickUp tracking for pull requests. Leave commented to keep
  # today's triggers. Uncomment these, uncomment the clickup job at the
  # bottom, and set clickup_enabled to "true" to opt in. The sync job does
  # not run while clickup_enabled is "false", so it makes no ClickUp calls.
  # pull_request:
  #   types: [opened, edited, synchronize, reopened, closed, ready_for_review, converted_to_draft]
  # pull_request_review:
  #   types: [submitted, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  resolve:
    if: |
      (
        github.event_name == 'issues' &&
        github.event.action == 'opened'
      ) ||
      (
        github.event_name == 'issues' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 't3planet-ai'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.issue.labels.*.name, 'needs-information')
      )
    # Prefer a release tag (e.g. @v1.0.0) over @main in production.
    uses: nitsan-technologies/t3planet-ai-bot/.github/workflows/issue-resolver.yml@main
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      # CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
    with:
      bot_ref: main
      base_branch: main
      # ClickUp is off unless this is "true".
      clickup_enabled: "false"
      # IDs are not secret; store them as repository variables.
      # `secrets` cannot be used inside `with:`.
      # clickup_team_id: ${{ vars.CLICKUP_TEAM_ID }}
      # clickup_list_id: ${{ vars.CLICKUP_LIST_ID }}

  # clickup:
